<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stop deep forest squircle background -->
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082A20" />
      <stop offset="50%" stop-color="#051C15" />
      <stop offset="100%" stop-color="#03120E" />
    </linearGradient>

    <!-- Emerald ribbon gradients -->
    <linearGradient id="pwa-stem" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#00A86B" />
      <stop offset="70%" stop-color="#006A4E" />
      <stop offset="100%" stop-color="#00432E" />
    </linearGradient>

    <linearGradient id="pwa-stem-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pwa-top-arm" x1="20%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="pwa-bottom-arm" x1="10%" y1="10%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D3A" />
      <stop offset="40%" stop-color="#007A55" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="pwa-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="6" stdDeviation="6" flood-color="#001811" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="118" fill="url(#pwa-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="8" />

  <!-- Inner scaled "K" + fountain pen nib logo -->
  <g transform="translate(56, 56) scale(2.0)">
    <!-- 1. Left Vertical Curved Ribbon Stem -->
    <path
      d="M 68 28
         C 52 24, 38 34, 36 50
         C 34 68, 48 100, 48 126
         C 48 148, 42 165, 52 174
         C 60 181, 76 182, 84 170
         C 90 162, 88 138, 86 118
         C 84 94, 86 64, 82 46
         C 80 34, 76 30, 68 28 Z"
      fill="url(#pwa-stem)"
    />

    <!-- Stem Inner Light Edge -->
    <path
      d="M 68 28
         C 56 25, 42 34, 40 48
         C 38 62, 46 88, 52 108
         C 56 122, 60 92, 66 68
         C 70 50, 74 36, 68 28 Z"
      fill="url(#pwa-stem-light)"
      opacity="0.9"
    />

    <!-- 2. Top-Right Diagonal Sweeping Ribbon Arm -->
    <path
      d="M 94 88
         C 106 72, 126 50, 146 36
         C 156 29, 168 26, 172 32
         C 176 38, 168 54, 154 68
         C 136 86, 116 102, 102 110
         Z"
      fill="url(#pwa-top-arm)"
      filter="url(#pwa-shadow)"
    />

    <!-- 3. Bottom-Right Diagonal Ribbon Arm -->
    <path
      d="M 98 102
         C 114 116, 134 136, 150 154
         C 160 166, 168 174, 164 178
         C 160 182, 148 176, 132 166
         C 112 152, 94 136, 84 122
         Z"
      fill="url(#pwa-bottom-arm)"
    />

    <!-- 4. Central Calligraphy Fountain Pen Nib & Fold (Pure crisp white) -->
    <path
      d="M 72 82
         C 66 94, 66 112, 78 124
         C 88 134, 106 136, 122 126
         C 134 118, 142 106, 136 96
         C 130 86, 112 84, 98 86
         Z"
      fill="#F8FAFC"
      filter="url(#pwa-shadow)"
    />

    <!-- Calligraphy Fountain Pen Nib Body -->
    <path
      d="M 124 124
         L 86 90
         C 82 86, 78 84, 74 88
         C 70 92, 74 98, 80 104
         L 114 134
         C 120 138, 128 132, 124 124 Z"
      fill="#FFFFFF"
    />

    <!-- Pen Nib Point -->
    <path
      d="M 66 78
         L 94 102
         L 82 116
         L 58 92
         C 56 90, 58 84, 62 80
         Z"
      fill="#FFFFFF"
    />

    <!-- Pen Nib Ink Slit & Breather Hole -->
    <line
      x1="62"
      y1="82"
      x2="78"
      y2="98"
      stroke="#004D3A"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <circle
      cx="78"
      cy="98"
      r="2.5"
      fill="#004D3A"
    />

    <!-- White Ribbon Flow Wing Underfold -->
    <path
      d="M 88 104
         C 98 116, 114 122, 130 114
         C 124 122, 110 126, 96 118
         Z"
      fill="#E2E8F0"
    />
  </g>
</svg>
